<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="images/logo.png" alt="Late Plate">
    </a>

    <nav class="site-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About</a></li>

        <li><a href="faq.html">FAQ</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <h1>Contact</h1>
    <p>Fill in the form to book a table. Fields with * are required.</p>

    <!-- The form is sent to reserve.php on the server.
         "required" stops the browser from sending it with an empty field. -->
    <form id="booking" action="reserve.php" method="post">
      <div class="field">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone">
      </div>

      <div class="field">
        <label for="party">Party size *</label>
        <select id="party" name="party" required>
          <option value="">Choose</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5+">5 or more</option>
        </select>
      </div>

      <div class="field">
        <label for="date">Date *</label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="field">
        <label for="time">Time *</label>
        <input type="time" id="time" name="time" required>
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3"></textarea>
      </div>

      <button class="btn" type="submit">Book a table</button>
    </form>

    <section>
      <h2>Other ways to reach us</h2>
      <p>123 Northwestern Avenue, West Lafayette, IN 47906<br>
         (765) 555-0142 &middot; hello@lateplate.example</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Late Plate, West Lafayette, IN</p>
  </footer>

</body>
</html>
